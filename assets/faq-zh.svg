<text x="112" y="55" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="21" font-weight="700" fill="#f0f0f6">装完没生效？</text>
<rect x="64" y="74" width="34" height="24" rx="12" fill="#1a1a24" stroke="#56B6C2"/>
<text x="81" y="91" text-anchor="middle" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="700" fill="#56B6C2">A</text>
<text x="112" y="92" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" fill="#b8b8c2">重启 DSH，或刷新页面即可。</text>
<rect x="40" y="140" width="880" height="108" rx="14" fill="#0e0e14" stroke="#2a2a34"/>

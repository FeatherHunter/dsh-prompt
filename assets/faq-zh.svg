<text x="81" y="179" text-anchor="middle" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="700" fill="#FAB283">Q</text>
<text x="112" y="179" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="21" font-weight="700" fill="#f0f0f6">预置模板能删吗？</text>
<rect x="64" y="198" width="34" height="24" rx="12" fill="#1a1a24" stroke="#56B6C2"/>
<text x="81" y="215" text-anchor="middle" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="700" fill="#56B6C2">A</text>
<text x="112" y="216" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" fill="#b8b8c2">不能直接删，但可以一键「复制为自定义」再改。</text>
<rect x="40" y="264" width="880" height="108" rx="14" fill="#0e0e14" stroke="#2a2a34"/>
<rect x="64" y="286" width="34" height="24" rx="12" fill="#1a1a24" stroke="#FAB283"/>
<text x="81" y="303" text-anchor="middle" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="700" fill="#FAB283">Q</text>
<text x="112" y="303" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="21" font-weight="700" fill="#f0f0f6">智能卡太吵？</text>
<rect x="64" y="322" width="34" height="24" rx="12" fill="#1a1a24" stroke="#56B6C2"/>
<text x="81" y="339" text-anchor="middle" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="700" fill="#56B6C2">A</text>
<text x="112" y="340" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" fill="#b8b8c2">设置里关掉即可，面板和 /prompt 不受影响。</text>
<rect x="40" y="388" width="880" height="108" rx="14" fill="#0e0e14" stroke="#2a2a34"/>
<rect x="64" y="410" width="34" height="24" rx="12" fill="#1a1a24" stroke="#FAB283"/>
<text x="81" y="427" text-anchor="middle" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="700" fill="#FAB283">Q</text>
<text x="112" y="427" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="21" font-weight="700" fill="#f0f0f6">换电脑数据会丢吗？</text>
<rect x="64" y="446" width="34" height="24" rx="12" fill="#1a1a24" stroke="#56B6C2"/>
<text x="81" y="463" text-anchor="middle" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="16" font-weight="700" fill="#56B6C2">A</text>
<text x="112" y="464" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="19" fill="#b8b8c2">目前是本地存储；导出/迁移在计划里，着急就开 Issue 催我。</text>

<text x="81" y="339" text-anchor="middle" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="14" font-weight="700" fill="#56B6C2">A</text>
<text x="112" y="340" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="17" fill="#b8b8c2">Turn it off in settings; panel and /prompt are unaffected.</text>

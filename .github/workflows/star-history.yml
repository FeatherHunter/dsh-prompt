name: Star History
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 第三方步骤统一固定到提交哈希：井号后面的版本只给人看，实际跑的是前面的哈希。标签会被覆盖，哈希不会。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node ≥ 22.18：仓库里的 .ts 脚本靠原生类型剥离直跑（engines 门槛同样是 >=22.18.0）
          node-version: 22.18
      - name: Fetch star history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh api -H "Accept: application/vnd.github.star+json" "repos/FeatherHunter/dsh-prompt/stargazers?per_page=100" --paginate --jq ".[].starred_at" > /tmp/stars.txt || true
          if [ ! -s /tmp/stars.txt ]; then echo "No stars fetched"; exit 0; fi
          node scripts/update-star-history.ts /tmp/stars.txt
      # README 的四块（联系 / 星图 / 致谢 / 作者作品）统一由 base 包渲染：
      # 星图 ?v= 取 docs/star-history.json 末条日期（YYYYMMDDHHmm），图换了缓存戳自动跟着换。
      - name: Sync managed README blocks
        run: npx -y dsh-featherhunter-plugin-base@0.1.1 readme:sync --repo .
      - name: Commit if changed
        run: |
          if git diff --quiet README.md docs/README.en.md docs/star-history.json docs/star-history.svg; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.en.md docs/star-history.json docs/star-history.svg
          git commit -m "每日更新 Star History：拉取星标数据并重绘手绘曲线图"
          # 别裸 push：任务跑得久，期间远端可能又前进了（源仓那批每日任务就是这么全红的）。
          if ! git pull --rebase origin main; then
            echo "rebase 冲突，今天先不更新"; git rebase --abort || true; exit 0
          fi
          git push origin HEAD:main

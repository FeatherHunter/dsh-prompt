<text x="112" y="216" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans SC,sans-serif" font-size="17" fill="#b8b8c2">Not directly — one-click copy-as-custom, then edit.</text>
